[package]
name = "tauri-runtime-qt"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Tauri 2 on Qt: Qt Widgets windows and a QtWebEngine webview instead of wry, on Linux"
repository = "https://github.com/Alper-Celik/TauriQt"
readme = "../README.md"
keywords = ["tauri", "qt", "qtwebengine", "runtime", "webview"]
categories = ["gui", "web-programming"]

[features]
devtools = []
# `tauri-runtime` 2.12 added `WindowDispatch::set_fullscreen_on_monitor` as a
# *required* method (no default body). This runtime's implementation is a stub
# that answers "not implemented", so a consumer built against an older
# `tauri-runtime` (Readest runs a vendored 2.11, see
# integrations/readest/README.md) turns this off — there the method does not
# exist, and defining it is E0407.
tauri-runtime-2-12 = []
default = ["tauri-runtime-2-12"]

[dependencies]
cxx = "1"
http = "1"
parking_lot = "0.12"
tauri-runtime = "2"
tauri-runtime-qt-core = { path = "../tauri-runtime-qt-core", version = "0.0.0" }
tauri-utils = "2"
url = "2"
cookie = "0.18"
raw-window-handle = "0.6"

[build-dependencies]
cxx-build = "1"
qt-build-utils = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
