[package]
name = "tauri-runtime-qt"
version = "0.1.0"
edition = "2021"

[features]
devtools = []

[dependencies]
cxx = "1"
http = "1"
parking_lot = "0.12"
tauri-runtime = "2"
tauri-utils = "2"
url = "2"
cookie = "0.18"
raw-window-handle = "0.6"

[build-dependencies]
cxx-build = "1"
qt-build-utils = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
