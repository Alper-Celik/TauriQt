#
# Minimal sway config for headless CI sessions (driven by
# scripts/sway-session.sh, which appends generated `output` lines for the
# requested output count/scale/resolution).
#
# Wayland-native by design: XWayland stays disabled unless a session was started
# with `--xwayland`, in which case the script appends `xwayland enable`.
# No bars, no wallpapers, no keybindings, no `exec` lines: nothing but the
# clients under test ever appears in the session, and nothing leaks on teardown.

xwayland disable

# Deterministic canvas. A uniform colour in a `grim` capture means nothing was
# painted by the client, which makes screenshot assertions meaningful.
output * bg #000000 solid_color

# The client is the only thing on screen: no decorations, no gaps, no borders
# that would end up in a capture.
default_border none
default_floating_border none
hide_edge_borders both
gaps inner 0
gaps outer 0
