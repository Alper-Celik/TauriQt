<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TauriQt — IPC smoke</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 3rem;
      }
      #result {
        font-size: 1.5rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>TauriQt</h1>
    <p id="result">calling invoke('greet') …</p>
    <script>
      const out = document.getElementById("result");
      // Titles are surfaced to the runtime as events, so they double as a
      // terminal-visible probe while the IPC path is being brought up.
      if (typeof window.__TAURI_INTERNALS__ === "undefined") {
        document.title = "NO_INTERNALS";
        out.textContent = "window.__TAURI_INTERNALS__ is undefined";
      } else {
        document.title = "HAS_INTERNALS";
        window.__TAURI_INTERNALS__
          .invoke("greet", { name: "Qt" })
          .then((msg) => {
            document.title = "INVOKE_OK";
            out.textContent = msg;
          })
          .catch((err) => {
            document.title = "INVOKE_FAILED";
            out.textContent = "invoke failed: " + err;
          });
      }
    </script>
  </body>
</html>
