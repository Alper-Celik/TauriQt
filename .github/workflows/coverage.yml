#
# `coverage` — merged llvm coverage (Rust + C++), driven by the same harnesses
# the checks run: scripts/coverage.sh builds an instrumented app, runs
# smoke/wayland-smoke with `TAURIQT_EXIT_AFTER_MS` so every run flushes its
# profile, merges with llvm-profdata and exports one lcov.info for both
# languages, then renders coverage/html (genhtml) and coverage/report
# (ReportGenerator — the same `Html;Badges` output ProjectRead.ing publishes to
# Cloudflare Pages).
#
# x86_64 only: this is about which of our lines the harnesses reach, which is
# architecture-independent, and the matrix already proves the app builds on both
# systems. The job fails when the pipeline breaks (no instrumentation data,
# instrumented build or smoke failure) — never on a coverage percentage.
#
# Called by ci.yml (gated on `eval`, with the repository secrets inherited).
name: coverage

on:
  workflow_call:
    secrets:
      # Both optional: a fork PR has neither, and the publish is skipped.
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  coverage:
    name: coverage (llvm, x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: samueldr/lix-gha-installer-action@v2026-06-15
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-x86_64-linux-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-x86_64-linux-
          gc-max-store-size-linux: 8G
      - name: Instrument, run the harnesses, merge and render
        shell: bash
        run: |
          set -o pipefail
          env LD_LIBRARY_PATH= nix develop .#ci -c scripts/coverage.sh 2>&1 | tee coverage.log
      - name: Write the coverage table into the run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Coverage (llvm, Rust + C++)"
            echo
            if [ -s coverage/summary.md ]; then
              cat coverage/summary.md
            else
              echo "_no coverage/summary.md: the run stopped before the report step (see the job log)._"
            fi
            echo
            echo "Artifacts: \`coverage-lcov\` (lcov.info + profdata + harness logs), \`coverage-html\` (genhtml), \`coverage-report\` (ReportGenerator)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-lcov
          path: |
            coverage/lcov.info
            coverage/merged.profdata
            coverage/summary.md
            coverage/logs/
            coverage.log
          retention-days: 14
      # The genhtml report and the ReportGenerator report are uploaded
      # separately: the first is always there, the second only when the dotnet
      # tool resolves on the runner.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-html
          path: coverage/html/
          retention-days: 14
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage/report/
          retention-days: 14
      # Cloudflare Pages publish, the ProjectRead.ing shape: `wrangler pages
      # deploy` of the ReportGenerator output, once per commit with the SHA as
      # the branch (every run keeps its own preview URL) and once onto `main`
      # for a main build. Both stay off until the repository has a
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secret — a fork PR has
      # neither — and neither blocks the run: the artifacts above always carry
      # the reports.
      - name: Publish the HTML report to Cloudflare Pages
        id: pages-preview
        # `secrets` is not a valid context in a step-level `if`, so the token is
        # hoisted into the step's env and the condition reads that instead.
        if: ${{ success() && env.CLOUDFLARE_API_TOKEN != '' && hashFiles('coverage/report/index.html') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            pages deploy --project-name tauriqt-coverage --branch ${{ github.sha }} coverage/report
      - name: Publish the HTML report to Cloudflare Pages (main)
        if: ${{ success() && github.ref_name == 'main' && env.CLOUDFLARE_API_TOKEN != '' && hashFiles('coverage/report/index.html') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            pages deploy --project-name tauriqt-coverage --branch main coverage/report
      # Two URLs. The per-commit one is the SHA alias Cloudflare derives from the
      # branch the report was deployed under (aliases are 28 characters of it).
      # The custom domain is Pages' *production* hostname, so it serves the
      # latest `main` build rather than this run.
      - name: Link the published report in the run summary
        if: ${{ steps.pages-preview.conclusion == 'success' }}
        shell: bash
        run: |
          {
            echo "#### Coverage report (this commit): https://${GITHUB_SHA:0:28}.tauriqt-coverage.pages.dev/"
            echo "Latest on \`main\`: https://tauriqt-coverage.alper-celik.dev/"
          } >> "$GITHUB_STEP_SUMMARY"
