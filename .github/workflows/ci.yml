#
# Nix-only CI.
#
# Every binary the harness runs — sway/cage/weston (headless compositors), grim
# (captures), dbus, Xvfb (the X11 guard), node (the CDP/WebDriver probes under
# tools/), chromedriver (WebDriver), cargo/Qt (the app itself) — comes from this
# flake's `devShells.<system>.ci` and `checks.<system>.*`. The runner contributes
# Nix itself and nothing else: no apt-get, no actions/setup-*, no
# runner-provided language toolchains.
#
# Shape: `eval` gates (flake must evaluate for both systems), `lint` is hygiene,
# and `checks` is a matrix over {system} × {check} with fail-fast disabled so one
# red cell never hides the others. `collect` then runs regardless of the outcome,
# folds every cell's status and log tail into one table in the run summary, and
# fails the run if anything did — so a single required status is meaningful.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap gate in front of the heavy jobs: every flake output must evaluate for
  # both supported systems, nothing is built. Cross-arch evaluation
  # (--all-systems) catches e.g. a harness tool that does not exist on arm64
  # before any build starts.
  eval:
    name: flake eval (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-
          gc-max-store-size-linux: 8G
      - name: Evaluate all flake outputs for both systems (no builds)
        run: nix flake check --no-build --all-systems

  # Hygiene only — any architecture will do.
  lint:
    name: lint (reuse)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-x86_64-linux-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-x86_64-linux-
          gc-max-store-size-linux: 8G
      - name: REUSE compliance
        run: nix develop .#ci -c just lint-reuse

  # The matrix: every flake check on every supported system. Each cell is a
  # hermetic `nix build` of one check derivation, so results are cached by input
  # and the cells are independent of each other.
  # Local equivalents: `just check <name>`, `just check-all`, `just test`.
  checks:
    name: ${{ matrix.check }} (${{ matrix.sys.system }})
    needs: eval
    runs-on: ${{ matrix.sys.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        check:
          - smoke            # engine smoke on Xvfb (x11 guard)
          - wayland-smoke    # headless sway: boot + invoke + capture
          - sway-oracle      # compositor-as-oracle: state/geometry/multi-output
        sys:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        # (also enables KVM on Linux runners — needed if we later add a VM/nixosTest tier)
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.sys.system }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.sys.system }}-
          gc-max-store-size-linux: 8G
      - name: Run check
        shell: bash
        run: |
          set -o pipefail
          nix build ".#checks.${{ matrix.sys.system }}.${{ matrix.check }}" --no-link -L \
            2>&1 | tee "check-${{ matrix.sys.system }}-${{ matrix.check }}.log"
      - name: Record result and log tail
        if: always()
        shell: bash
        run: |
          mkdir -p results
          base="results/${{ matrix.sys.system }}-${{ matrix.check }}"
          printf '%s|%s|%s\n' "${{ matrix.sys.system }}" "${{ matrix.check }}" "${{ job.status }}" > "$base.txt"
          if [ -f "check-${{ matrix.sys.system }}-${{ matrix.check }}.log" ]; then
            tail -c 60000 "check-${{ matrix.sys.system }}-${{ matrix.check }}.log" > "$base.log"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-${{ matrix.sys.system }}-${{ matrix.check }}
          path: results/
          retention-days: 14

  # Runs no matter what happened above, gathers every cell's status + log tail,
  # writes one table into the run summary, keeps the logs as a single artifact,
  # and only then decides the run's outcome.
  collect:
    name: collect results
    needs: [eval, lint, checks]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Write summary
        shell: bash
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          {
            echo "## TauriQt CI results"
            echo
            echo "| system | check | result |"
            echo "|---|---|---|"
            while IFS= read -r f; do
              IFS='|' read -r sys chk res < "$f"
              case "$res" in
                success)   icon="✅" ;;
                cancelled) icon="⚪" ;;
                *)         icon="❌" ;;
              esac
              echo "| $sys | $chk | $icon $res |"
            done < <(find results -maxdepth 1 -name '*.txt' | sort)
            echo
            echo "gates — eval: \`${{ needs.eval.result }}\` · lint: \`${{ needs.lint.result }}\` · checks: \`${{ needs.checks.result }}\`"
          } >> "$summary"

          # Failed cells get their log tail inlined, so a red run is readable
          # without downloading anything.
          while IFS= read -r f; do
            IFS='|' read -r sys chk res < "$f"
            log="results/${sys}-${chk}.log"
            if [ "$res" != "success" ] && [ -f "$log" ]; then
              {
                echo
                echo "<details><summary>❌ ${sys}/${chk} — last lines</summary>"
                echo
                echo '```'
                tail -40 "$log"
                echo '```'
                echo "</details>"
              } >> "$summary"
            fi
          done < <(find results -maxdepth 1 -name '*.txt' | sort)
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ci-logs
          path: results/
          retention-days: 14
      - name: Decide outcome
        shell: bash
        run: |
          echo "eval=${{ needs.eval.result }} lint=${{ needs.lint.result }} checks=${{ needs.checks.result }}"
          for r in "${{ needs.eval.result }}" "${{ needs.lint.result }}" "${{ needs.checks.result }}"; do
            [ "$r" = "success" ] || { echo "::error::CI failed (see the summary table above)"; exit 1; }
          done
