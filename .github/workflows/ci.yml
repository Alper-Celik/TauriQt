#
# Nix-only CI — the orchestrator.
#
# Every job's definition lives in its own file beside this one and is invoked as
# a reusable workflow (`uses: ./.github/workflows/<job>.yml`), so the whole graph
# still runs inside *this* workflow's run: one run summary, one concurrency
# group, and one aggregating `collect` gate whose status is the run's outcome.
#
#   eval.yml       flake evaluates for both systems (gates the heavy jobs)
#   lint.yml       hygiene: REUSE
#   checks.yml     {3 flake checks} × {x86_64, aarch64}
#   coverage.yml   merged llvm coverage + the Cloudflare Pages publish
#   apps-list.yml  integrations/apps.json -> the apps matrix
#   apps.yml       one cell per third-party app (nightly/dispatch only)
#   collect.yml    folds every cell into the summary and decides the outcome
#
# Nix comes from Lix (samueldr/lix-gha-installer-action), not the Determinate
# Systems distribution — the installer is FOSS (LGPL-2.1) and installs upstream
# Lix from lix.systems. Every *other* binary the harness runs — sway/cage/weston
# (headless compositors), grim (captures), dbus, Xvfb (the X11 guard), node (the
# CDP/WebDriver probes under tools/), chromedriver (WebDriver), cargo/Qt (the app
# itself) — comes from this flake's `devShells.<system>.ci` and
# `checks.<system>.*`. The runner contributes Nix itself and nothing else: no
# apt-get, no actions/setup-*, no runner-provided language toolchains.
#
# Each job passes `extra_nix_config: experimental-features = nix-command flakes`
# because Lix's installer does not enable the CLI's experimental features (the
# Determinate installer used to) and every command here is a flake command.
# flake.nix carries no `nixConfig`, so there is nothing else to accept.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The third-party app integrations (job `apps`) are a full app build each, so
  # they run nightly and on demand rather than on every push.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    uses: ./.github/workflows/eval.yml

  lint:
    uses: ./.github/workflows/lint.yml

  checks:
    needs: eval
    uses: ./.github/workflows/checks.yml

  coverage:
    needs: eval
    uses: ./.github/workflows/coverage.yml
    # The Cloudflare credentials are optional (see coverage.yml) and are passed
    # on rather than declared here, so a fork PR cannot see them.
    secrets: inherit

  apps-list:
    uses: ./.github/workflows/apps-list.yml

  apps:
    needs: [eval, apps-list]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/apps.yml
    with:
      matrix: ${{ needs.apps-list.outputs.matrix }}

  # Runs no matter what happened above, gathers every cell's status + log tail,
  # writes one table into the run summary, keeps the logs as a single artifact,
  # and only then decides the run's outcome. `needs.*.result` is a caller-level
  # context, so the results are handed to the job as inputs.
  collect:
    needs: [eval, lint, checks, coverage, apps]
    if: always()
    uses: ./.github/workflows/collect.yml
    with:
      eval_result: ${{ needs.eval.result }}
      lint_result: ${{ needs.lint.result }}
      checks_result: ${{ needs.checks.result }}
      coverage_result: ${{ needs.coverage.result }}
      apps_result: ${{ needs.apps.result }}
