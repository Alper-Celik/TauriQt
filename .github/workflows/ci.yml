#
# Nix-only CI.
#
# Every binary the harness runs — sway/cage/weston (headless compositors), grim
# (captures), dbus, Xvfb (the X11 guard), node (the CDP/WebDriver probes under
# tools/), chromedriver (WebDriver), cargo/Qt (the app itself) — comes from this
# flake's `devShells.<system>.ci` and `checks.<system>.*`. The runner contributes
# Nix itself and nothing else: no apt-get, no actions/setup-*, no
# runner-provided language toolchains.
#
# Shape: `eval` gates (flake must evaluate for both systems), `lint` is hygiene,
# `checks` is a matrix over {system} × {check} with fail-fast disabled so one red
# cell never hides the others, and `apps` runs other people's applications
# against this runtime (integrations/apps.json drives its matrix). `collect` then runs regardless of the outcome,
# folds every cell's status and log tail into one table in the run summary, and
# fails the run if anything did — so a single required status is meaningful.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The third-party app integrations (job `apps`) are a full app build each, so
  # they run nightly and on demand rather than on every push.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap gate in front of the heavy jobs: every flake output must evaluate for
  # both supported systems, nothing is built. Cross-arch evaluation
  # (--all-systems) catches e.g. a harness tool that does not exist on arm64
  # before any build starts.
  eval:
    name: flake eval (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-
          gc-max-store-size-linux: 8G
      - name: Evaluate all flake outputs for both systems (no builds)
        run: nix flake check --no-build --all-systems

  # Hygiene only — any architecture will do.
  lint:
    name: lint (reuse)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-x86_64-linux-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-x86_64-linux-
          gc-max-store-size-linux: 8G
      - name: REUSE compliance
        run: nix develop .#ci -c just lint-reuse

  # The matrix: every flake check on every supported system. Each cell is a
  # hermetic `nix build` of one check derivation, so results are cached by input
  # and the cells are independent of each other.
  # Local equivalents: `just check <name>`, `just check-all`, `just test`.
  checks:
    name: ${{ matrix.check }} (${{ matrix.sys.system }})
    needs: eval
    runs-on: ${{ matrix.sys.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        check:
          - smoke            # engine smoke on Xvfb (x11 guard)
          - wayland-smoke    # headless sway: boot + invoke + capture
          - sway-oracle      # compositor-as-oracle: state/geometry/multi-output
        sys:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        # (also enables KVM on Linux runners — needed if we later add a VM/nixosTest tier)
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.sys.system }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.sys.system }}-
          gc-max-store-size-linux: 8G
      - name: Run check
        shell: bash
        run: |
          set -o pipefail
          nix build ".#checks.${{ matrix.sys.system }}.${{ matrix.check }}" --no-link -L \
            2>&1 | tee "check-${{ matrix.sys.system }}-${{ matrix.check }}.log"
      - name: Record result and log tail
        if: always()
        shell: bash
        run: |
          mkdir -p results
          base="results/${{ matrix.sys.system }}-${{ matrix.check }}"
          printf '%s|%s|%s\n' "${{ matrix.sys.system }}" "${{ matrix.check }}" "${{ job.status }}" > "$base.txt"
          if [ -f "check-${{ matrix.sys.system }}-${{ matrix.check }}.log" ]; then
            tail -c 60000 "check-${{ matrix.sys.system }}-${{ matrix.check }}.log" > "$base.log"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-${{ matrix.sys.system }}-${{ matrix.check }}
          path: results/
          retention-days: 14

  # Merged llvm coverage (Rust + C++), driven by the same harnesses the checks
  # run: scripts/coverage.sh builds an instrumented app, runs smoke/wayland-smoke
  # with `TAURIQT_EXIT_AFTER_MS` so every run flushes its profile, merges with
  # llvm-profdata and exports one lcov.info for both languages, then renders
  # coverage/html (genhtml) and coverage/report (ReportGenerator — the same
  # `Html;Badges` output ProjectRead.ing publishes to Cloudflare Pages).
  #
  # x86_64 only: this is about which of our lines the harnesses reach, which is
  # architecture-independent, and the matrix already proves the app builds on
  # both systems. The job fails when the pipeline breaks (no instrumentation
  # data, instrumented build or smoke failure) — never on a coverage percentage.
  coverage:
    name: coverage (llvm, x86_64-linux)
    needs: eval
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-x86_64-linux-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-x86_64-linux-
          gc-max-store-size-linux: 8G
      - name: Instrument, run the harnesses, merge and render
        shell: bash
        run: |
          set -o pipefail
          env LD_LIBRARY_PATH= nix develop .#ci -c scripts/coverage.sh 2>&1 | tee coverage.log
      - name: Write the coverage table into the run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Coverage (llvm, Rust + C++)"
            echo
            if [ -s coverage/summary.md ]; then
              cat coverage/summary.md
            else
              echo "_no coverage/summary.md: the run stopped before the report step (see the job log)._"
            fi
            echo
            echo "Artifacts: \`coverage-lcov\` (lcov.info + profdata + harness logs), \`coverage-html\` (genhtml), \`coverage-report\` (ReportGenerator)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-lcov
          path: |
            coverage/lcov.info
            coverage/merged.profdata
            coverage/summary.md
            coverage/logs/
            coverage.log
          retention-days: 14
      # The genhtml report and the ReportGenerator report are uploaded
      # separately: the first is always there, the second only when the dotnet
      # tool resolves on the runner.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-html
          path: coverage/html/
          retention-days: 14
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: coverage/report/
          retention-days: 14
      # Cloudflare Pages publish, the ProjectRead.ing shape: `wrangler pages
      # deploy` of the ReportGenerator output, once per commit with the SHA as
      # the branch (every run keeps its own preview URL) and once onto `main`
      # for a main build. Both stay off until the repository has a
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secret — a fork PR has
      # neither — and neither blocks the run: the artifacts above always carry
      # the reports.
      - name: Publish the HTML report to Cloudflare Pages
        id: pages-preview
        # `secrets` is not a valid context in a step-level `if`, so the token is
        # hoisted into the step's env and the condition reads that instead.
        if: ${{ success() && env.CLOUDFLARE_API_TOKEN != '' && hashFiles('coverage/report/index.html') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            pages deploy --project-name tauriqt-coverage --branch ${{ github.sha }} coverage/report
      - name: Publish the HTML report to Cloudflare Pages (main)
        if: ${{ success() && github.ref_name == 'main' && env.CLOUDFLARE_API_TOKEN != '' && hashFiles('coverage/report/index.html') != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            pages deploy --project-name tauriqt-coverage --branch main coverage/report
      # Two URLs. The per-commit one is the SHA alias Cloudflare derives from the
      # branch the report was deployed under (aliases are 28 characters of it).
      # The custom domain is Pages' *production* hostname, so it serves the
      # latest `main` build rather than this run.
      - name: Link the published report in the run summary
        if: ${{ steps.pages-preview.conclusion == 'success' }}
        shell: bash
        run: |
          {
            echo "#### Coverage report (this commit): https://${GITHUB_SHA:0:28}.tauriqt-coverage.pages.dev/"
            echo "Latest on \`main\`: https://tauriqt-coverage.alper-celik.dev/"
          } >> "$GITHUB_STEP_SUMMARY"

  # Third-party applications this runtime is tested against. The list lives in
  # integrations/apps.json (see integrations/README.md); this job only turns it
  # into a matrix, so adding an app is a directory plus an entry there.
  apps-list:
    name: list app integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - id: matrix
        run: |
          # shellcheck disable=SC2016  # the $… are jq's, not the shell's
          matrix="$(nix shell nixpkgs#jq -c jq -c \
            '{include: [.apps[] as $a | $a.systems[] | {app: $a.name, system: ., entry: $a.entry, timeout: ($a["timeout-minutes"] // 120)}]}' \
            integrations/apps.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "apps: $matrix"

  # One cell per app: build it against this runtime and run its own assertions.
  # Heavy by nature (a 1000-crate Rust build plus a frontend install), which is
  # why it is gated to the nightly/dispatch triggers. Each app owns its entry
  # script; CI only provides the checkout location (outside the repo on purpose:
  # a checkout nested in this cargo workspace makes cargo resolve the app's
  # vendored crates against our workspace root).
  apps:
    name: ${{ matrix.app }} (${{ matrix.system }})
    needs: [eval, apps-list]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.apps-list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-
          gc-max-store-size-linux: 8G
      - name: Run the app's integration
        shell: bash
        # `runner` is only available inside a step, not in a job-level env.
        env:
          INTEGRATION_CHECKOUT: ${{ runner.temp }}/${{ matrix.app }}-checkout
        run: |
          set -o pipefail
          nix develop .#ci -c "${{ matrix.entry }}" \
            2>&1 | tee "app-${{ matrix.app }}-${{ matrix.system }}.log"
      - name: Record result and log tail
        if: always()
        shell: bash
        run: |
          mkdir -p results
          base="results/${{ matrix.system }}-${{ matrix.app }}"
          printf '%s|%s|%s\n' "${{ matrix.system }}" "${{ matrix.app }}" "${{ job.status }}" > "$base.txt"
          if [ -f "app-${{ matrix.app }}-${{ matrix.system }}.log" ]; then
            tail -c 60000 "app-${{ matrix.app }}-${{ matrix.system }}.log" > "$base.log"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-${{ matrix.system }}-${{ matrix.app }}
          path: results/
          retention-days: 14

  # Runs no matter what happened above, gathers every cell's status + log tail,
  # writes one table into the run summary, keeps the logs as a single artifact,
  # and only then decides the run's outcome.
  collect:
    name: collect results
    needs: [eval, lint, checks, coverage, apps]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: Write summary
        shell: bash
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          coverage_result="${{ needs.coverage.result }}"
          case "$coverage_result" in
            success)   coverage_icon="✅" ;;
            cancelled) coverage_icon="⚪" ;;
            *)         coverage_icon="❌" ;;
          esac
          {
            echo "## TauriQt CI results"
            echo
            echo "| system | check | result |"
            echo "|---|---|---|"
            while IFS= read -r f; do
              IFS='|' read -r sys chk res < "$f"
              case "$res" in
                success)   icon="✅" ;;
                cancelled) icon="⚪" ;;
                *)         icon="❌" ;;
              esac
              echo "| $sys | $chk | $icon $res |"
            done < <(find results -maxdepth 1 -name '*.txt' | sort)
            echo "| x86_64-linux | coverage | $coverage_icon $coverage_result |"
            echo
            echo "gates — eval: \`${{ needs.eval.result }}\` · lint: \`${{ needs.lint.result }}\` · checks: \`${{ needs.checks.result }}\` · coverage: \`$coverage_result\` · apps: \`${{ needs.apps.result }}\`"
            echo
            echo "The coverage job writes its own table (and its artifacts) into the run summary above its job log; \`coverage/summary.md\` is in the \`coverage-lcov\` artifact."
          } >> "$summary"

          # Failed cells get their log tail inlined, so a red run is readable
          # without downloading anything.
          while IFS= read -r f; do
            IFS='|' read -r sys chk res < "$f"
            log="results/${sys}-${chk}.log"
            if [ "$res" != "success" ] && [ -f "$log" ]; then
              {
                echo
                echo "<details><summary>❌ ${sys}/${chk} — last lines</summary>"
                echo
                echo '```'
                tail -40 "$log"
                echo '```'
                echo "</details>"
              } >> "$summary"
            fi
          done < <(find results -maxdepth 1 -name '*.txt' | sort)
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ci-logs
          path: results/
          retention-days: 14
      - name: Decide outcome
        shell: bash
        run: |
          echo "eval=${{ needs.eval.result }} lint=${{ needs.lint.result }} checks=${{ needs.checks.result }} coverage=${{ needs.coverage.result }}"
          for r in "${{ needs.eval.result }}" "${{ needs.lint.result }}" "${{ needs.checks.result }}" "${{ needs.coverage.result }}"; do
            [ "$r" = "success" ] || { echo "::error::CI failed (see the summary table above)"; exit 1; }
          done
          # The app tier is gated to schedule/dispatch, so a skip is expected.
          case "${{ needs.apps.result }}" in
            success | skipped) ;;
            *) echo "::error::CI failed (app integration, see the summary table above)"; exit 1 ;;
          esac
