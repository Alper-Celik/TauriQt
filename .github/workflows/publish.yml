#
# `publish` — upload the two runtime crates to crates.io from CI.
#
# Trigger is the version tag (`v0.0.1`), because that is the one thing that says
# "this commit is a release". The tag has to agree with the manifests' `version`
# — a forgotten bump fails here, before anything reaches the registry — and the
# script this calls refuses a dirty tree and version skew (`scripts/publish.sh`).
#
# Nothing publishes from a release CI has not graded: the first step requires the
# tag to be *in* main and waits for main's tip to be green — GitHub attaches a CI
# run to the tip of a push, so a tag on an ancestor commit has no run of its own
# (that is what hung the v0.0.1 run). It fails when every finished run disagreed,
# or when none appears in 30 minutes. Tagging right after pushing therefore works
# — the job waits for the graph to finish — while a tag on a commit CI never
# passed is refused rather than released. (Any green run counts, so a later flaky
# cell does not retroactively block a release.)
#
# Authentication is crates.io's trusted publishing (RFC 3691): this workflow
# proves who it is with GitHub's OIDC token and gets a short-lived crates.io token
# in return, so there is **no repository secret** and no long-lived credential
# anywhere near the release. rust-lang/crates-io-auth-action revokes the token in
# its post step. One token covers both crates — the crates.io configuration is
# per crate, but it trusts *this workflow*, not a token.
#
# Its installer step also turns `auto-optimise-store` off, for the reason spelled
# out in ci.yml: cache-nix-action cannot restore a store that deduplicated into
# `/nix/store/.links` (its issue #170), and a half-failed restore poisons the
# store for every step after it. The cache key carries the same `-g2` generation.
#
# One-time bootstrap, because crates.io only accepts that configuration on a crate
# that already exists: create an API token, `cargo login`, publish the first
# release by hand (`just publish`), then add the trusted publisher to both crates
# (Settings -> Trusted Publishing: owner `Alper-Celik`, repository `TauriQt`,
# workflow `publish.yml`). From then on a tag needs nothing set up anywhere.
#
# `workflow_dispatch` with `dry-run` left on packages and verify-builds both
# crates without minting a token at all.
#
# x86_64 only, and not part of ci.yml's graph (`ci.yml` builds on a push to
# `main`, which a tag push does not match): the crates are
# platform-independent, and their verification — compiling the packaged tarballs,
# including the runtime's C++/Qt bridge — is the same work on either system.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Package and verify-build both crates, but upload nothing
        type: boolean
        default: true

permissions:
  contents: read
  # To read the CI runs of this commit (the gate below).
  actions: read
  # To mint the crates.io token through GitHub's OIDC provider.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  # A release must not be cancelled halfway; a queued re-run is the way to retry.
  cancel-in-progress: false

jobs:
  crates-io:
    name: crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Full history: the gate below asks whether the tagged commit is contained
      # in main, which needs the commit graph, not one commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: samueldr/lix-gha-installer-action@v2026-06-15
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            auto-optimise-store = false
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-x86_64-linux-g2-${{ hashFiles('flake.lock', 'Cargo.lock') }}
          restore-prefixes-first-match: nix-x86_64-linux-g2-
          gc-max-store-size-linux: 8G
      - name: Wait for CI to have graded this release
        if: github.event_name == 'push' || inputs.dry-run == false
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # What has to be graded is the *release*, and GitHub attaches a CI run to
          # the tip of the push that triggered it — so a tag on anything but main's
          # very latest commit (an ancestor, which is the normal case when a commit
          # lands between the tag and the push, and the very case that hung a
          # release on 2026-10-15) has no run of its own. The rule is therefore:
          # the tag is on main, and main's tip is green.
          git fetch --quiet origin main
          tip="$(git rev-parse FETCH_HEAD)"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$tip"; then
            echo "::error::$GITHUB_SHA is not in main's history (tip $tip); releases are cut from main, so nothing has graded this commit"
            exit 1
          fi
          echo "releasing ${GITHUB_SHA}, contained in main's tip ${tip}"
          # curl + grep rather than gh: the runner provides Nix and nothing else
          # (see ci.yml), and this needs no JSON tooling of its own. Every
          # pipeline is `|| true`-guarded: `grep -o` exits 1 on no match, and
          # GitHub runs this script with `set -e`.
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs"
          deadline=$((SECONDS + 1800))
          while :; do
            body="$(curl -sf -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "$api?head_sha=${tip}&per_page=100" || true)"
            if printf '%s' "$body" | grep -q '"conclusion": *"success"'; then
              echo "CI is green for ${tip}"
              break
            fi
            finished="$(printf '%s' "$body" | grep -o '"conclusion": *"[a-z_]*"' | cut -d'"' -f4 | sort -u || true)"
            unfinished="$(printf '%s' "$body" | grep -o '"status": *"[a-z_]*"' | cut -d'"' -f4 | grep -vx completed || true)"
            # Only a *failure* is a verdict against the release. A cancelled or
            # timed-out run says nothing about the commit — CI being re-run after
            # a flaky cell is normal, and refusing on it turns that into a failed
            # release run (the v0.0.1 retry). Those keep waiting instead.
            if printf '%s\n' "$finished" | grep -qx failure; then
              echo "::error::CI for main's tip ${tip} failed (${finished//$'\n'/ }); fix main, then re-run this workflow"
              exit 1
            fi
            if [[ -n "$finished" && -z "$unfinished" && "$SECONDS" -ge "$deadline" ]]; then
              echo "::error::every CI run for main's tip ${tip} finished without a success (${finished//$'\n'/ }); re-run CI for it, then re-run this workflow"
              exit 1
            fi
            if [[ -z "$finished" && -z "$unfinished" && "$SECONDS" -ge "$deadline" ]]; then
              echo "::error::no CI run for main's tip ${tip} appeared in 30 min; dispatch one (gh workflow run CI), then re-run this workflow"
              exit 1
            fi
            if [[ -z "$finished" && -z "$unfinished" ]]; then
              echo "no CI run for main's tip ${tip} yet…"
            else
              echo "waiting for CI on ${tip} (finished:${finished:-none} unfinished:${unfinished:-none})…"
            fi
            sleep 30
          done
      - name: Check the tag against the manifests
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' tauri-runtime-qt/Cargo.toml | head -1)"
          if [[ "${GITHUB_REF_TYPE}" == tag && "${GITHUB_REF_NAME}" != "v$version" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the manifests' version ${version} (scripts/publish.sh checks the three versions against each other)"
            exit 1
          fi
      - name: Package and verify-build both crates
        shell: bash
        run: |
          set -o pipefail
          env LD_LIBRARY_PATH= nix develop .#ci -c scripts/publish.sh --dry-run 2>&1 | tee publish-dry-run.log
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        if: github.event_name == 'push' || inputs.dry-run == false
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        if: github.event_name == 'push' || inputs.dry-run == false
        shell: bash
        env:
          # Minted for this run and revoked by the action's post step; versions
          # already on the registry are skipped, so this is safe to re-run.
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -o pipefail
          env LD_LIBRARY_PATH= nix develop .#ci -c scripts/publish.sh 2>&1 | tee publish.log
      - name: Write the run summary
        if: always()
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' tauri-runtime-qt/Cargo.toml | head -1)"
          {
            if [[ "${{ github.event_name }}" == push || "${{ inputs.dry-run }}" == false ]]; then
              echo "## crates.io: tauri-runtime-qt{,-core} ${version}"
            else
              echo "## crates.io dry run: tauri-runtime-qt{,-core} ${version}"
            fi
            echo
            echo "- tag: \`${{ github.ref_name }}\` at \`${{ github.sha }}\`"
            echo "- crate: <https://crates.io/crates/tauri-runtime-qt/${version}>"
            echo
            if [[ -s publish-dry-run.log ]]; then
              echo "<details><summary>packaging + verify build</summary>"
              echo
              echo '```'
              tail -c 4000 publish-dry-run.log
              echo '```'
              echo "</details>"
            fi
            if [[ -s publish.log ]]; then
              echo "<details><summary>publish</summary>"
              echo
              echo '```'
              tail -c 4000 publish.log
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: publish-logs
          path: |
            publish.log
            publish-dry-run.log
          retention-days: 14
