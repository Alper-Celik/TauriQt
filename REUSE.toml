version = 1

# Licensing information lives in the files themselves wherever a file can hold a
# comment: every source file carries SPDX tags and wins over anything here (the
# default "closest" precedence). What remains are the formats that cannot say it
# themselves — generated manifests, JSON, a binary icon — and the captured
# measurement artifacts. Each group says why it is here; nothing is annotated
# just because it was convenient.

# Generated by cargo / nix; regenerated on every resolve, so a header would be
# lost immediately.
[[annotations]]
path = ["Cargo.lock", "flake.lock"]
SPDX-FileCopyrightText = "2026 Alper Çelik"
SPDX-License-Identifier = "MIT"

# JSON has no comments. These are ours (config, fixtures), not third-party data.
[[annotations]]
path = [
  ".config/dotnet-tools.json",
  "integrations/apps.json",
  "integrations/readest/cdp-stubs.json",
  "tauriqt/tauri.conf.json",
  "tools/cdp-probe/stubs.example.json",
]
SPDX-FileCopyrightText = "2026 Alper Çelik"
SPDX-License-Identifier = "MIT"

# A diff, not a file: it adds our lines to Readest's sources. The lines are ours
# (MIT); the files it patches stay AGPL-3.0 and remain theirs — this repository
# keeps the patch, never a copy of their tree.
[[annotations]]
path = ["integrations/readest/readest-qt-runtime.patch"]
SPDX-FileCopyrightText = "2026 Alper Çelik"
SPDX-License-Identifier = "MIT"

# A binary.
[[annotations]]
path = ["tauriqt/icons/icon.png"]
SPDX-FileCopyrightText = "2026 Alper Çelik"
SPDX-License-Identifier = "MIT"

# Captured output from the CDP/WebDriver probes, kept as evidence for the docs
# that cite them (docs/cdp-support-matrix.md, docs/webdriver-attach-findings.md).
# `override` is deliberate: these dumps contain whatever the page said, and one
# of them embeds a DOM node whose text is an SPDX tag — read literally, the
# linter reported a malformed licence expression that says nothing about the
# artifact's own licence.
[[annotations]]
path = [
  "tools/cdp-probe/last-run.json",
  "tools/cdp-probe/last-run-mitm.jsonl",
  "tools/cdp-probe/last-playwright-attach.json",
  "tools/cdp-probe/last-playwright-attach-direct.json",
  "tools/webdriver-probe/probe-out*/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Alper Çelik"
SPDX-License-Identifier = "MIT"
